[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchlight-craft-planner"
version = "0.1.0"
description = "Offline Torchlight: Infinite equipment editor"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["core", "services", "data"]
include-package-data = true

[tool.setuptools.package-data]
data = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyside6-project]
files = [
    "main.py",
    "core/__init__.py",
    "core/catalog.py",
    "core/controller.py",
    "core/models.py",
    "core/serialization.py",
    "core/validation.py",
    "services/__init__.py",
    "services/item_repository.py",
    "data/__init__.py",
    "ui/Main.qml",
    "ui/ItemEditor.qml",
    "ui/components/AffixSelector.qml",
    "ui/components/AffixRow.qml",
    "ui/components/BaseSelector.qml",
    "ui/components/TierBadge.qml",
]

[tool.pyside6.deploy]
title = "Torchlight Craft Planner"
input_file = "main.py"
exec_directory = "dist"
icon = "assets/icons/planner-mark.ico"
mode = "standalone"
extra_args = "--include-data-dir=ui=ui --include-data-dir=assets=assets --include-data-dir=data=data --include-package-data=data --windows-console-mode=disable --assume-yes-for-downloads"
