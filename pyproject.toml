[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchlight-craft-planner"
version = "0.2.0"
description = "Offline Torchlight: Infinite equipment editor"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["app", "app.viewmodels", "core", "core.models", "services", "data"]
include-package-data = true

[tool.setuptools.package-data]
data = ["*.json", "*.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyside6-project]
files = [
    "main.py",
    "core/__init__.py",
    "core/catalog.py",
    "core/controller.py",
    "app/controller.py",
    "core/models/__init__.py",
    "core/models/affix.py",
    "core/models/base.py",
    "core/models/equipment.py",
    "core/serialization.py",
    "core/validation.py",
    "app/__init__.py",
    "app/viewmodels/__init__.py",
    "app/viewmodels/item_editor.py",
    "app/viewmodels/affix_browser.py",
    "app/viewmodels/library.py",
    "services/__init__.py",
    "services/affix_browser.py",
    "services/item_editor_service.py",
    "services/item_library_service.py",
    "services/item_repository.py",
    "data/__init__.py",
    "ui/Main.qml",
    "ui/ItemEditor.qml",
    "ui/components/AffixSelector.qml",
    "ui/components/AffixSlot.qml",
    "ui/components/BaseSelector.qml",
    "ui/components/ItemLibraryDialog.qml",
    "ui/components/TierBadge.qml",
    "ui/theme/Theme.js",
]

[tool.pyside6.deploy]
title = "Torchlight Craft Planner"
input_file = "main.py"
exec_directory = "dist"
icon = "assets/icons/planner-mark.ico"
mode = "standalone"
extra_args = "--windows-console-mode=disable --assume-yes-for-downloads"
