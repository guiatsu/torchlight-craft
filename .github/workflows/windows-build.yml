name: Windows standalone build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 artifact
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install project dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          py -3.12 -m venv build\.venv
          .\build\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\build\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: .\build\.venv\Scripts\python.exe -m pytest

      - name: Build standalone application
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path 'build\.venv\Scripts');$env:PATH"
          .\build\.venv\Scripts\pyside6-deploy.exe --mode standalone --force

      - name: Verify and archive executable
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "dist" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name.EndsWith(".dist") } |
            Select-Object -First 1
          if ($null -eq $bundle) {
            Get-ChildItem dist -Recurse -ErrorAction SilentlyContinue
            throw "The standalone output folder was not generated."
          }
          $executable = Get-ChildItem -Path $bundle.FullName -Filter "*.exe" -File |
            Select-Object -First 1
          if ($null -eq $executable) {
            Get-ChildItem $bundle.FullName -Recurse
            throw "No executable was found in $($bundle.FullName)."
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $executable.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged application failed its QML startup smoke test."
          }
          $archive = "dist\TorchlightCraftPlanner-Windows-x64.zip"
          Compress-Archive -Path $bundle.FullName -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorchlightCraftPlanner-Windows-x64
          path: dist/TorchlightCraftPlanner-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
