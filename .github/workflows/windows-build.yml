name: Windows standalone build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 artifact
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install project dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          py -3.12 -m venv build\.venv
          .\build\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\build\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: .\build\.venv\Scripts\python.exe -m pytest

      - name: Stage runtime files
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "torchlight-craft-runtime-$env:GITHUB_RUN_ID"
          .\tools\stage_windows_runtime.ps1 -Destination $stage
          "RUNTIME_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build standalone application
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:RUNTIME_STAGE).Path
          $env:PATH = "$(Resolve-Path 'build\.venv\Scripts');$env:PATH"
          Push-Location $workspace
          try {
            & (Join-Path $env:GITHUB_WORKSPACE "build\.venv\Scripts\pyside6-deploy.exe") --mode standalone --force
            if ($LASTEXITCODE -ne 0) {
              throw "pyside6-deploy failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Verify and archive executable
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:RUNTIME_STAGE).Path
          $bundle = Get-ChildItem -Path (Join-Path $workspace "dist") -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name.EndsWith(".dist") } |
            Select-Object -First 1
          if ($null -eq $bundle) {
            Get-ChildItem (Join-Path $workspace "dist") -Recurse -ErrorAction SilentlyContinue
            throw "The standalone output folder was not generated."
          }
          $executable = Get-ChildItem -Path $bundle.FullName -Filter "*.exe" -File |
            Select-Object -First 1
          if ($null -eq $executable) {
            Get-ChildItem $bundle.FullName -Recurse
            throw "No executable was found in $($bundle.FullName)."
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_DEBUG_PLUGINS = "1"
          $diagnosticLog = Join-Path $env:TEMP "TorchlightCraftPlanner-startup.log"
          $smokeStdOut = Join-Path $env:TEMP "TorchlightCraftPlanner-smoke.stdout.log"
          $smokeStdErr = Join-Path $env:TEMP "TorchlightCraftPlanner-smoke.stderr.log"
          Remove-Item -LiteralPath $diagnosticLog -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $smokeStdOut, $smokeStdErr -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $executable.FullName -ArgumentList @("--smoke-test-craft") -WorkingDirectory $bundle.FullName -RedirectStandardOutput $smokeStdOut -RedirectStandardError $smokeStdErr -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "Packaged GUI executable exited with code $($process.ExitCode)."
            if (Test-Path -LiteralPath $diagnosticLog) {
              Get-Content -LiteralPath $diagnosticLog
            }
            else {
              Write-Host "No startup diagnostic file was created at $diagnosticLog."
            }
            foreach ($log in @($smokeStdOut, $smokeStdErr)) {
              if (Test-Path -LiteralPath $log) {
                Write-Host "Captured output from $log"
                Get-Content -LiteralPath $log -Tail 200
              }
            }
            Get-ChildItem $bundle.FullName -Recurse | Select-Object -First 80 FullName
            throw "The packaged application failed its QML craft-flow smoke test."
          }
          Remove-Item -LiteralPath (Join-Path $bundle.FullName "assets\icons\planner-mark.ico") -Force -ErrorAction SilentlyContinue
          $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $archiveDirectory | Out-Null
          $archive = Join-Path $archiveDirectory "TorchlightCraftPlanner-Windows-x64.zip"
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $bundle.FullName -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorchlightCraftPlanner-Windows-x64
          path: dist/TorchlightCraftPlanner-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
